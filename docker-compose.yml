services:
  scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Bind to localhost only so the scanner API is not exposed to the network
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - SENTINEL_API_KEY=${SENTINEL_API_KEY:-}
    env_file:
      - .env
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  target_api:
    build:
      context: ./target_api
      dockerfile: Dockerfile
    # Docker-internal scans initiated from the scanner container use http://target_api:9000
    # Host tests/curls access target_api on http://127.0.0.1:9000
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - SECURE=${SECURE:-false}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-demo-only-32bytes-long!!}
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      scanner:
        condition: service_healthy
    networks:
      - sentinel_net

networks:
  sentinel_net:
    name: sentinel_net
    driver: bridge
