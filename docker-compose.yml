services:
  scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Bind to localhost only so the scanner API is not exposed to the network
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - SENTINEL_API_KEY=${SENTINEL_API_KEY:-}
      - AI_ENABLED=${AI_ENABLED:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
      - LLM_API_KEY=${LLM_API_KEY:-}
    env_file:
      - .env
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  target_api:
    build:
      context: ./target_api
      dockerfile: Dockerfile
    # Docker-internal scans initiated from the scanner container use http://target_api:9000
    # Host tests/curls access target_api on http://127.0.0.1:9000
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - SECURE=${SECURE:-false}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-demo-only-32bytes-long!!}
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      scanner:
        condition: service_healthy
    networks:
      - sentinel_net

  health_api:
    build:
      context: ./sample_targets/health_api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  fintech_api:
    build:
      context: ./sample_targets/fintech_api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9002:9002"
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  secure_api:
    build:
      context: ./sample_targets/secure_api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9003:9003"
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9003/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  sentinel_net:
    name: sentinel_net
    driver: bridge
