openapi: 3.0.3
info:
  title: Minimal OpenAPI 3 Test Spec
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /items:
    get:
      summary: List items
      operationId: list_items
      responses:
        '200':
          description: A list of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      summary: Create item
      operationId: create_item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: Created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'

  /items/{id}:
    get:
      summary: Get single item
      operationId: get_item_by_id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Single item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'

  /public-info:
    get:
      summary: Public metadata endpoint
      operationId: get_public_info
      security: []
      responses:
        '200':
          description: Public operational details
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Item:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    ItemInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
