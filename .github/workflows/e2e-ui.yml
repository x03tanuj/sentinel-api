name: E2E UI Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ui:
    name: Playwright End-to-End Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            target_api/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci

      - name: Install Playwright browsers and system dependencies
        run: |
          cd frontend && npx playwright install --with-deps chromium

      - name: Prepare environment configuration
        run: cp .env.example .env

      - name: Build and spin up full stack with mock LLM service
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for all services to become healthy
        run: |
          for i in {1..40}; do
            if curl -s -f http://127.0.0.1:8080/ && \
               curl -s -f http://127.0.0.1:8000/health && \
               curl -s -f http://127.0.0.1:9000/health && \
               curl -s -f http://127.0.0.1:8001/health; then
              echo "All services (frontend, scanner, target_api, mock_llm) are healthy."
              break
            fi
            echo "Waiting for stack readiness... ($i/40)"
            sleep 3
          done

      - name: Reset target database state
        run: curl -s -X POST http://127.0.0.1:9000/_reset

      - name: Run Playwright E2E tests
        run: |
          cd frontend && npm run e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Screenshots and Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            docs/screenshots/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs

      - name: Tear down full Docker stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
